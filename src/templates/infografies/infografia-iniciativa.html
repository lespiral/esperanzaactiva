{# infografia-iniciativa.html: copiat del bloc INICI–FINAL de la carpeta «Infografies web» (5 de novembre de 2026). #}
<div class="ones" data-ones>
  <div class="ones__grid">
    <div class="ones__scene" role="group" aria-label="Cercles que s'obren: tu, la cura de les persones, els llocs del barri i la comunitat">
      <svg class="ones__svg" aria-hidden="true" focusable="false"></svg>
      <div class="ones__nodes"></div>
    </div>
    <div class="ones__side">
      <ol class="ones__list"></ol>
      <button type="button" class="ones__ps" data-k="ps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11.4a1.6 1.6 0 0 1 3.2 0a3.2 3.2 0 0 1-6.4 0a4.8 4.8 0 0 1 9.6 0a6.4 6.4 0 0 1-12.8 0"/></svg><span>L'Espiral i Elara Social</span></button>
      <div class="ones__cap" aria-live="polite"><p class="ones__ck"></p><p class="ones__ct"></p></div>
    </div>
  </div>
  <div class="ones__foot">
    <p class="ones__hint">Toca cada cercle per saber-ne més.</p>
    <button class="ones__replay" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.6h4.6"/></svg>
      <span>Torna-ho a veure</span>
    </button>
  </div>
</div>

<style>
.ones {
  --c9: var(--green-900, #11352c); --c8: var(--green-800, #1a4d40); --c7: var(--green-700, #22604f);
  --c6: var(--green-600, #2e7561); --c2: var(--green-200, #c9dcd4); --c1: var(--green-100, #e3eee9);
  --cs: var(--sun, #e2c668); --cs-ink: var(--sun-ink, #6f5711); --cline: var(--line, #e7e1d4);
  --cink: var(--ink, #23302b); --cmuted: var(--muted, #56635d);
  --fh: var(--font-head, "Montserrat", ui-sans-serif, system-ui, sans-serif);
  --fb: var(--font-body, "Lato", ui-sans-serif, system-ui, sans-serif);
  position: relative; overflow: hidden; background: #fff; color: var(--cink); font-family: var(--fb);
  border: 1px solid var(--cline); border-radius: var(--radius-lg, 22px);
  box-shadow: 0 1px 2px rgba(17,53,44,.06), 0 10px 28px rgba(17,53,44,.09);
}
.ones *, .ones *::before, .ones *::after { box-sizing: border-box; }
.ones p { margin: 0; }
.ones__grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; background: linear-gradient(180deg, #f3f5f2, #f8f4ea); }
.ones--stack .ones__grid { grid-template-columns: minmax(0, 1fr); }
.ones__scene { position: relative; height: var(--sh, 460px); }
.ones__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ones__nodes { position: absolute; inset: 0; }

/* Etiquetes dels cercles */
.ones__tag {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(.7); opacity: 0;
  width: max-content; padding: 4px 11px 5px; border-radius: 999px; border: 2px solid var(--col, var(--c2));
  background: #fff; color: var(--c9); font: 700 13.5px/1.2 var(--fh); cursor: pointer; -webkit-appearance: none; appearance: none;
  transition: opacity .4s, transform .5s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s;
}
.ones__tag.is-on { opacity: 1; transform: translate(-50%, -50%); }
.ones__tag.is-sel { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--cs); }
.ones__tag:focus { outline: none; }
.ones__tag:focus-visible { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c7); }
.ones__tag--num { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font-size: 13px; }
.ones__tag--me { background: var(--cs); border-color: #fff; border-width: 3px; padding: 6px 13px 7px; font-size: 14px; }

/* Llegenda */
.ones__side { padding: 26px 24px 22px 4px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.ones--stack .ones__side { padding: 6px 16px 20px; }
.ones__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ones__li { display: grid; grid-template-columns: 34px 1fr; gap: 0 11px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 14px; background: #fff; border: 1px solid var(--cline); cursor: pointer; transition: border-color .25s, box-shadow .25s, opacity .4s; opacity: .45; }
.ones__li.is-on { opacity: 1; }
.ones__li.is-now, .ones__li.is-sel { border-color: var(--cs); box-shadow: 0 0 0 2px rgba(226, 198, 104, .45); }
.ones__dot { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--col); background: #fff; color: var(--c8); font: 700 13px/1 var(--fh); }
.ones__lt { font: 700 15px/1.25 var(--fh); color: var(--c9); }
.ones__ls { font-size: 14px; line-height: 1.35; color: var(--cmuted); }
.ones__ps {
  display: flex; gap: 9px; align-items: flex-start; text-align: left; padding: 9px 12px; border-radius: 14px; cursor: pointer;
  background: #fff; border: 1px dashed var(--c2); color: var(--c7); font: 700 13.5px/1.35 var(--fh); -webkit-appearance: none; appearance: none;
  transition: border-color .25s, box-shadow .25s;
}
.ones__ps svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ones__ps.is-sel { border-style: solid; border-color: var(--cs); box-shadow: 0 0 0 2px rgba(226, 198, 104, .45); }
.ones__ps:focus { outline: none; }
.ones__ps:focus-visible { box-shadow: 0 0 0 3px var(--c7); }
.ones__cap { min-height: 70px; padding: 10px 13px 11px; border-radius: 14px; background: #fff; border: 1px solid var(--cline); }
.ones__ck { font: 700 11.5px/1.3 var(--fh); letter-spacing: .08em; text-transform: uppercase; color: var(--cs-ink); }
.ones__ct { font-size: 15px; line-height: 1.45; color: var(--cink); margin-top: 3px !important; }
.ones__cap.is-fresh { animation: ones-fade .35s ease; }

/* SVG */
.ones__ring { transform-box: view-box; transform: scale(.2); opacity: 0; transition: transform 1.1s cubic-bezier(.34, 1.3, .64, 1), opacity .6s; }
.ones__ring.is-on { transform: none; opacity: 1; }
.ones__ico { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; transition: opacity .4s, transform .6s cubic-bezier(.34, 1.56, .64, 1); }
.ones__ico.is-on { opacity: 1; transform: none; }
.ones__link { stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.2s ease; }
.ones__link.is-on { stroke-dashoffset: 0; }
.ones__glow { opacity: 0; transition: opacity 1.4s; }
.ones.is-done .ones__glow { opacity: 1; }
.ones__wave { transform-box: fill-box; transform-origin: center; animation: ones-wave 2.6s ease-out infinite; opacity: 0; }
.ones.is-done .ones__wave { animation-play-state: running; }

.ones__foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  min-height: 60px; padding: 10px clamp(14px, 3vw, 24px); border-top: 1px solid var(--cline); background: #fff;
}
.ones__hint { font-size: 14.5px; color: var(--cmuted); }
.ones__replay {
  flex: none; display: inline-flex; align-items: center; gap: .45em; padding: .55em 1em;
  border-radius: 999px; border: 2px solid var(--c2); background: #fff; color: var(--c8);
  font: 700 14px/1.2 var(--fh); cursor: pointer; transition: border-color .15s, color .15s, transform .15s;
}
.ones__replay:hover { border-color: var(--c7); color: var(--c9); transform: translateY(-1px); }
.ones__replay:focus-visible { outline: 3px solid var(--c7); outline-offset: 2px; }
.ones__replay svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ones__replay[hidden] { display: none; }
@keyframes ones-wave { 0% { transform: scale(.3); opacity: .5; } 100% { transform: scale(1); opacity: 0; } }
@keyframes ones-fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .ones *, .ones *::before, .ones *::after { animation: none !important; transition: none !important; }
  .ones__wave { display: none; }
}
</style>

<script>
(function () {
  "use strict";
  var root = document.querySelector("[data-ones]");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  /* ---------- TEXTOS (de la web; es poden canviar aquí) ---------- */
  var RINGS = [
    { tag: "Tu", col: "#e2c668", title: "Tu", sub: "Arribes amb el que portes", kick: "El centre",
      text: "Arribes amb el que portes, i tu marques el ritme: pots parar, respirar o deixar-ho quan ho necessitis." },
    { tag: "Cuidem les persones", col: "#2e7561", title: "Cuidem les persones", sub: "Una pràctica i una caminada", kick: "El primer cercle",
      text: "Una pràctica, una caminada, un petit pas. Al teu ritme." },
    { tag: "Els llocs del barri", col: "#22604f", title: "Els llocs del barri", sub: "Places, parcs, CAP i equipaments", kick: "El segon cercle",
      text: "Les rutes surten de places, parcs, CAP, hospitals i equipaments a prop de casa." },
    { tag: "Enfortim les comunitats", col: "#1a4d40", title: "Enfortim les comunitats", sub: "Continuar el camí amb altres", kick: "El tercer cercle",
      text: "El tancament obre la porta a continuar el camí en comunitat o amb processos més amplis, si ho vols." }
  ];
  // Canvi de la web (5 de novembre): en lloc de la definició de la Prescripció Social, la signatura de L'Espiral i Elara Social
  var PS = { kick: "Una iniciativa de L'Espiral i Elara Social", title: "L'Espiral i Elara Social",
    text: "Cuidem les persones. Enfortim les comunitats. Consciència · Comunitat · Acció." };
  var INTRO = ["Com un cercle a l'aigua", "Del que vius tu al que podem cuidar entre tots."];
  var OUTRO = ["L'Espiral i Elara Social", "Cuidem les persones. Enfortim les comunitats."];

  var ICON = {
    me: '<circle cx="12" cy="7" r="3.4"/><path d="M5.5 20.5v-1.8a6.5 6.5 0 0 1 13 0v1.8"/>',
    phones: '<path d="M4.5 15.5V13a7.5 7.5 0 0 1 15 0v2.5"/><rect x="3.5" y="14" width="4.2" height="6.5" rx="1.8"/><rect x="16.3" y="14" width="4.2" height="6.5" rx="1.8"/>',
    steps: '<path d="M8.3 2.8c1.8 0 2.7 2 2.7 4.3S10.1 11.8 8.3 11.8 5.6 9.4 5.6 7.1 6.5 2.8 8.3 2.8z"/><path d="M6.4 14h3.8v1.1a1.9 1.9 0 0 1-3.8 0z"/><path d="M15.8 7c1.8 0 2.7 2 2.7 4.3s-.9 4.7-2.7 4.7-2.7-2.4-2.7-4.7S14 7 15.8 7z"/><path d="M13.9 18.2h3.8v1.1a1.9 1.9 0 0 1-3.8 0z"/>',
    cap: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
    placa: '<path d="M4.5 15h15"/><path d="M6.5 15v3.5h11V15"/><path d="M12 15V8.5"/><path d="M12 8.5c-2-2.6-4.3-2.6-5.8 0M12 8.5c2-2.6 4.3-2.6 5.8 0"/>',
    parc: '<path d="M12 3a5 5 0 0 1 5 5 4 4 0 0 1-2 7.3H9A4 4 0 0 1 7 8a5 5 0 0 1 5-5z"/><path d="M12 15.3V21"/>',
    equip: '<path d="M3.5 9.5 12 4.5l8.5 5"/><path d="M4.5 20h15"/><path d="M6.5 10.5V17.5M10 10.5V17.5M14 10.5V17.5M17.5 10.5V17.5"/>'
  };

  var T = [500, 1400, 2500, 3600, 5000]; // quan surt cada cercle i quan s'acaba
  var SIDE = 820;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var scene = root.querySelector(".ones__scene");
  var svg = root.querySelector(".ones__svg");
  var nodesBox = root.querySelector(".ones__nodes");
  var list = root.querySelector(".ones__list");
  var ps = root.querySelector(".ones__ps");
  var cap = root.querySelector(".ones__cap"), ck = root.querySelector(".ones__ck"), ct = root.querySelector(".ones__ct");
  var replay = root.querySelector(".ones__replay");
  var S = { t: 0, sel: null, playing: false, started: false, last: null, raf: 0, width: 0 };
  var G = null, lastKey = "", lastCap = "";

  function r1(n) { return Math.round(n * 10) / 10; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  list.innerHTML = RINGS.map(function (r, i) {
    return '<li class="ones__li" data-k="r' + i + '" role="button" tabindex="0"><span class="ones__dot" style="--col:' + r.col + '">' + (i === 0 ? "" : i) + '</span>' +
      '<span class="ones__lt">' + esc(r.title) + '</span><span class="ones__ls">' + esc(r.sub) + '</span></li>';
  }).join("");
  var lis = Array.prototype.slice.call(list.children);

  /* ---------- DIBUIX ---------- */
  function render() {
    var CW = Math.round(root.clientWidth);
    if (!CW) return;
    root.classList.toggle("ones--stack", CW < SIDE);
    var W = Math.round(scene.clientWidth), size = Math.min(W - 16, 480), H = Math.round(size + 20);
    var cx = W / 2, cy = H / 2, R = [0, size * .2, size * .335, size * .47], ico = Math.round(Math.max(30, size * .075));
    root.style.setProperty("--sh", H + "px");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    G = { W: W, H: H, cx: cx, cy: cy, R: R };
    var out = ['<defs><radialGradient id="ones-glow"><stop offset="0" stop-color="#f1e3b0" stop-opacity=".9"/><stop offset=".6" stop-color="#f8efd2" stop-opacity=".35"/><stop offset="1" stop-color="#fcf8ea" stop-opacity="0"/></radialGradient></defs>',
      '<circle class="ones__glow" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(R[3] * 1.08) + '" fill="url(#ones-glow)"/>',
      '<circle class="ones__wave" cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(R[3]) + '" fill="none" stroke="#e2c668" stroke-width="3"/>'];
    function pol(r, deg) { var a = deg * Math.PI / 180; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }
    // Cercles
    [1, 2, 3].forEach(function (i) {
      out.push('<g class="ones__ring" data-r="' + i + '" style="transform-origin:' + r1(cx) + 'px ' + r1(cy) + 'px"><circle cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="' + r1(R[i]) + '" fill="' + ["", "rgba(46,117,97,.07)", "rgba(34,96,79,.05)", "rgba(26,77,64,.04)"][i] + '" stroke="' + RINGS[i].col + '" stroke-width="' + (i === 3 ? 3 : 2.5) + '"' + (i === 3 ? '' : ' stroke-dasharray="2 7" stroke-linecap="round"') + '/></g>');
    });
    // Xarxa de la comunitat: persones al voltant del cercle exterior, unides
    var ppl = [], n = 18, k;
    for (k = 0; k < n; k++) { var deg = -90 + 360 * (k + .5) / n; if (Math.abs(((deg + 90) % 360 + 360) % 360) < 16 || Math.abs(((deg + 90) % 360 + 360) % 360 - 360) < 16) continue; ppl.push(pol(R[3], deg)); }
    var links = [];
    for (k = 0; k < ppl.length - 1; k++) links.push([ppl[k], ppl[k + 1]]);
    // Fils dels llocs del barri cap a la comunitat
    var placeDeg = [210, 330, 30, 150], places = placeDeg.map(function (d) { return pol(R[2], d); });
    places.forEach(function (p, i) {
      var a = pol(R[3], placeDeg[i] - 14), b = pol(R[3], placeDeg[i] + 14);
      links.push([p, a]); links.push([p, b]);
    });
    links.forEach(function (l, i) {
      out.push('<line class="ones__link" pathLength="1" style="transition-delay:' + (i * 40) + 'ms" x1="' + r1(l[0][0]) + '" y1="' + r1(l[0][1]) + '" x2="' + r1(l[1][0]) + '" y2="' + r1(l[1][1]) + '" stroke="#e2c668" stroke-width="2" stroke-linecap="round"/>');
    });
    var cols = ["#2e7561", "#22604f", "#1a4d40", "#c9a53c"];
    ppl.forEach(function (p, i) {
      var s = Math.max(.8, size / 460);
      out.push('<g class="ones__ico" data-r="3" style="transition-delay:' + (i * 45) + 'ms" fill="' + cols[i % 4] + '"><circle cx="' + r1(p[0]) + '" cy="' + r1(p[1] - 5 * s) + '" r="' + r1(5 * s) + '"/><path d="M' + r1(p[0] - 7.5 * s) + ' ' + r1(p[1] + 9 * s) + 'a7.5 7.5 0 0 1 ' + r1(15 * s) + ' 0z" /></g>');
    });
    function iconAt(p, name, r, delay) {
      var sz = ico;
      return '<g class="ones__ico" data-r="' + r + '" style="transition-delay:' + delay + 'ms"><circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + r1(sz / 2 + 2) + '" fill="#fff" stroke="' + RINGS[r].col + '" stroke-width="2"/>' +
        '<g transform="translate(' + r1(p[0] - sz * .3) + ',' + r1(p[1] - sz * .3) + ') scale(' + r1(sz * .6 / 24 * 100) / 100 + ')" fill="none" stroke="' + RINGS[r].col + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[name] + '</g></g>';
    }
    out.push(iconAt(pol(R[1], 200), "phones", 1, 0), iconAt(pol(R[1], 340), "steps", 1, 120));
    ["cap", "placa", "parc", "equip"].forEach(function (nm, i) { out.push(iconAt(places[i], nm, 2, i * 110)); });
    svg.innerHTML = out.join("");

    // Etiquetes damunt de cada cercle
    var html = ['<div style="position:absolute;left:' + r1(cx) + 'px;top:' + r1(cy) + 'px"><button type="button" class="ones__tag ones__tag--me" data-k="r0" style="--col:#e2c668">' + esc(RINGS[0].tag) + '</button></div>'];
    // En pantalles petites, cada cercle porta el seu número (la llegenda de sota diu què és)
    var small = size < 420;
    [1, 2, 3].forEach(function (i) {
      html.push('<div style="position:absolute;left:' + r1(cx) + 'px;top:' + r1(cy - R[i]) + 'px"><button type="button" class="ones__tag' + (small ? ' ones__tag--num' : '') + '" data-k="r' + i + '" style="--col:' + RINGS[i].col + '" aria-label="' + esc(RINGS[i].tag) + '">' + (small ? i : esc(RINGS[i].tag)) + '</button></div>');
    });
    nodesBox.innerHTML = html.join("");
    G.rings = Array.prototype.slice.call(svg.querySelectorAll(".ones__ring"));
    G.icos = Array.prototype.slice.call(svg.querySelectorAll(".ones__ico"));
    G.links = Array.prototype.slice.call(svg.querySelectorAll(".ones__link"));
    G.tags = Array.prototype.slice.call(nodesBox.querySelectorAll(".ones__tag"));
    lastKey = ""; lastCap = "";
    apply();
  }

  /* ---------- ESTAT ---------- */
  function apply() {
    if (!G) return;
    var t = S.t, lvl = 0;
    for (var i = 0; i < 4; i++) if (t >= T[i]) lvl = i + 1;
    var done = t >= T[4];
    var key = [lvl, done, S.sel].join("|");
    if (key !== lastKey) {
      lastKey = key;
      G.rings.forEach(function (g) { g.classList.toggle("is-on", lvl >= +g.getAttribute("data-r") + 1); });
      G.icos.forEach(function (g) { g.classList.toggle("is-on", lvl >= +g.getAttribute("data-r") + 1); });
      G.links.forEach(function (l) { l.classList.toggle("is-on", lvl >= 4); });
      G.tags.forEach(function (g, i) { g.classList.toggle("is-on", lvl >= i + 1); g.classList.toggle("is-sel", S.sel === "r" + i); });
      lis.forEach(function (li, i) { li.classList.toggle("is-on", lvl >= i + 1 || done); li.classList.toggle("is-now", !done && !S.sel && lvl === i + 1); li.classList.toggle("is-sel", S.sel === "r" + i); });
      ps.classList.toggle("is-sel", S.sel === "ps");
      root.classList.toggle("is-done", done);
      replay.hidden = !(done && !reduce);
    }
    var c;
    if (S.sel === "ps") c = [PS.kick, PS.text];
    else if (S.sel) { var r = RINGS[+S.sel.slice(1)]; c = [r.title, r.text]; }
    else if (done) c = OUTRO;
    else if (lvl === 0) c = INTRO;
    else { var rr = RINGS[lvl - 1]; c = [rr.title, rr.text]; }
    var ckey = c.join("|");
    if (ckey !== lastCap) {
      lastCap = ckey;
      ck.textContent = c[0]; ct.textContent = c[1];
      cap.classList.remove("is-fresh"); void cap.offsetWidth; cap.classList.add("is-fresh");
    }
  }

  /* ---------- ANIMACIÓ ---------- */
  function tick(ts) {
    if (!S.playing) return;
    if (S.last === null) S.last = ts;
    S.t += Math.min(64, ts - S.last); S.last = ts;
    if (S.t >= T[4]) { S.t = T[4]; S.playing = false; }
    apply();
    if (S.playing) S.raf = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(S.raf);
    S.started = true; S.sel = null;
    if (reduce) { S.t = T[4]; S.playing = false; lastKey = ""; apply(); return; }
    S.t = 0; S.last = null; S.playing = true; lastKey = "";
    apply();
    setTimeout(function () { S.raf = requestAnimationFrame(tick); }, 300);
  }
  function choose(k) {
    cancelAnimationFrame(S.raf); S.playing = false; S.t = T[4]; S.started = true;
    S.sel = S.sel === k ? null : k; lastKey = ""; apply();
  }
  root.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-k]") : null;
    if (el && root.contains(el)) choose(el.getAttribute("data-k"));
  });
  root.addEventListener("keydown", function (e) {
    var el = e.target.closest ? e.target.closest("li[data-k]") : null;
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); choose(el.getAttribute("data-k")); }
  });
  replay.addEventListener("click", function (e) { e.stopPropagation(); play(); });
