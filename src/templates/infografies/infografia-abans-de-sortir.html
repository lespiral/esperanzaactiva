{# infografia-abans-de-sortir.html: copiat del bloc INICI–FINAL de la carpeta «Infografies web» (5 de novembre de 2026). #}
<div class="sortir" data-sortir>
  <div class="sortir__scene" role="group" aria-label="Abans de sortir: dues opcions, avui camino o avui no és el dia">
    <svg class="sortir__svg" aria-hidden="true" focusable="false"></svg>
    <div class="sortir__nodes"></div>
    <div class="sortir__pop" aria-live="polite"><p class="sortir__pk"></p><p class="sortir__pt"></p><p class="sortir__px"></p></div>
  </div>
  <div class="sortir__foot">
    <p class="sortir__hint">Toca cada punt per saber-ne més.</p>
    <button class="sortir__replay" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.6h4.6"/></svg>
      <span>Torna-ho a veure</span>
    </button>
  </div>
</div>

<style>
.sortir {
  --c9: var(--green-900, #11352c); --c8: var(--green-800, #1a4d40); --c7: var(--green-700, #22604f);
  --c6: var(--green-600, #2e7561); --c2: var(--green-200, #c9dcd4);
  --cs: var(--sun, #e2c668); --cs-ink: var(--sun-ink, #6f5711); --cline: var(--line, #e7e1d4);
  --cink: var(--ink, #23302b); --cmuted: var(--muted, #56635d);
  --fh: var(--font-head, "Montserrat", ui-sans-serif, system-ui, sans-serif);
  --fb: var(--font-body, "Lato", ui-sans-serif, system-ui, sans-serif);
  --d: 46px;
  position: relative; overflow: hidden; background: #fff; color: var(--cink); font-family: var(--fb);
  border: 1px solid var(--cline); border-radius: var(--radius-lg, 22px);
  box-shadow: 0 1px 2px rgba(17,53,44,.06), 0 10px 28px rgba(17,53,44,.09);
}
.sortir *, .sortir *::before, .sortir *::after { box-sizing: border-box; }
.sortir p { margin: 0; }
.sortir__scene { position: relative; height: var(--sh, 420px); }
.sortir__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sortir__nodes { position: absolute; inset: 0; }
.sortir__node { position: absolute; width: 0; height: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.sortir__dot {
  position: absolute; left: 0; top: 0; width: var(--dd, var(--d)); height: var(--dd, var(--d));
  margin: calc(var(--dd, var(--d)) / -2) 0 0 calc(var(--dd, var(--d)) / -2); padding: 0;
  display: grid; place-items: center; border-radius: 50%; cursor: inherit; -webkit-appearance: none; appearance: none;
  background: #fff; border: 2px solid var(--c2); color: var(--c6);
  transition: background-color .4s, border-color .4s, color .4s, box-shadow .3s, transform .3s;
}
.sortir__dot svg { width: 54%; height: 54%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sortir__node.is-on .sortir__dot { background: var(--c8); border-color: var(--c8); color: #fff; }
.sortir__node.is-pop .sortir__dot { animation: sortir-pop .6s cubic-bezier(.34, 1.56, .64, 1); }
.sortir__node.is-sel .sortir__dot { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--cs); }
.sortir__node:hover .sortir__dot { transform: scale(1.07); }
.sortir__dot:focus { outline: none; }
.sortir__dot:focus-visible { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--c7); }
.sortir__tick {
  position: absolute; top: -5px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; background: var(--cs); border: 2px solid #fff; color: var(--c9);
  opacity: 0; transform: scale(.4); transition: opacity .3s, transform .4s cubic-bezier(.34, 1.8, .64, 1);
}
.sortir__tick svg { width: 11px; height: 11px; stroke-width: 3; }
.sortir__node.is-on .sortir__tick { opacity: 1; transform: none; }
.sortir__node--door .sortir__dot { --dd: calc(var(--d) + 4px); background: #fff; border-color: var(--c8); color: var(--c8); }
.sortir__node--end .sortir__dot { --dd: calc(var(--d) + 10px); }
.sortir__node--end.is-on .sortir__dot { background: var(--cs); border-color: var(--cs); color: var(--c9); box-shadow: 0 0 0 8px rgba(226, 198, 104, .35); }
.sortir__node--end.is-sel .sortir__dot { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--c7); }

.sortir__lab {
  position: absolute; width: max-content; max-width: var(--lw, 160px); padding: 3px 9px 4px; border-radius: 10px;
  background: rgba(255, 255, 255, .85); font: 700 clamp(13.5px, calc(var(--sw, 1000px) * .015), 15px)/1.25 var(--fh); color: var(--c9);
  text-wrap: balance; transition: opacity .4s, box-shadow .3s;
}
.sortir__node.is-sel .sortir__lab { background: #fff; box-shadow: 0 0 0 2px var(--cs); }
.sortir__lab--a { left: 0; bottom: calc(var(--dd, var(--d)) / 2 + 9px); transform: translateX(-50%); text-align: center; }
.sortir__lab--b { left: 0; top: calc(var(--dd, var(--d)) / 2 + 9px); transform: translateX(-50%); text-align: center; }
.sortir__lab--r { top: 0; left: calc(var(--dd, var(--d)) / 2 + 11px); transform: translateY(-50%); }
.sortir__node--door .sortir__lab, .sortir__node--end .sortir__lab { --dd: calc(var(--d) + 10px); }
/* Rètols de les dues opcions */
.sortir__way {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(.7); opacity: 0;
  width: max-content; padding: 5px 12px 6px; border-radius: 999px; background: var(--c8); color: #fff;
  font: 700 clamp(13px, calc(var(--sw, 1000px) * .0145), 14.5px)/1.2 var(--fh); white-space: nowrap; pointer-events: none;
  transition: opacity .4s, transform .5s cubic-bezier(.34, 1.56, .64, 1);
}
.sortir__way--b { background: var(--cs); color: var(--c9); }
.sortir__way.is-on { opacity: 1; transform: translate(-50%, -50%); }
.sortir__msg {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); opacity: 0; width: var(--mw, 240px);
  padding: 8px 14px 9px; border-radius: 14px; border: 2px dashed rgba(111, 87, 17, .4); background: rgba(252, 248, 234, .92);
  font: 700 clamp(13.5px, calc(var(--sw, 1000px) * .015), 15px)/1.35 var(--fh); color: var(--cs-ink); text-align: center;
  pointer-events: none; transition: opacity .6s;
}
.sortir__msg.is-on { opacity: 1; }

/* Globus */
.sortir__pop {
  position: absolute; left: 0; top: 0; width: min(290px, calc(100% - 24px));
  padding: 13px 15px 14px; border-radius: 14px; background: #fff;
  border: 1px solid var(--cline); box-shadow: 0 2px 4px rgba(17,53,44,.06), 0 14px 32px rgba(17,53,44,.16);
  opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .2s, transform .2s, visibility .2s; z-index: 3;
}
.sortir__pop.is-open { opacity: 1; visibility: visible; transform: none; }
.sortir__pk { font: 700 11.5px/1.3 var(--fh); letter-spacing: .08em; text-transform: uppercase; color: var(--cs-ink); }
.sortir__pt { font: 700 16px/1.3 var(--fh); color: var(--c9); margin-top: 3px !important; }
.sortir__px { font-size: 15.5px; line-height: 1.45; color: var(--cmuted); margin-top: 3px !important; }

.sortir__foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  min-height: 60px; padding: 10px clamp(14px, 3vw, 24px); border-top: 1px solid var(--cline); background: #fff;
}
.sortir__hint { font-size: 14.5px; color: var(--cmuted); }
.sortir__replay {
  flex: none; display: inline-flex; align-items: center; gap: .45em; padding: .55em 1em;
  border-radius: 999px; border: 2px solid var(--c2); background: #fff; color: var(--c8);
  font: 700 14px/1.2 var(--fh); cursor: pointer; transition: border-color .15s, color .15s, transform .15s;
}
.sortir__replay:hover { border-color: var(--c7); color: var(--c9); transform: translateY(-1px); }
.sortir__replay:focus-visible { outline: 3px solid var(--c7); outline-offset: 2px; }
.sortir__replay svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sortir__replay[hidden] { display: none; }
.sortir__halo { transform-box: fill-box; transform-origin: center; animation: sortir-pulse 1.8s ease-in-out infinite; }
@keyframes sortir-pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes sortir-pulse { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.5); opacity: .15; } }
@media (prefers-reduced-motion: reduce) {
  .sortir *, .sortir *::before, .sortir *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(function () {
  "use strict";
  var root = document.querySelector("[data-sortir]");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  /* ---------- TEXTOS (els de «Abans de sortir» de la web) ---------- */
  var DOOR = { label: "Abans de sortir", kick: "Abans de sortir", title: "Caminar és una proposta",
    text: "Caminar és una proposta, no una obligació. Si avui no és el dia, també pots fer la pràctica en un lloc tranquil." };
  var MSG = "Caminar és una proposta, no una obligació.";
  var WAYS = ["Avui camino", "Avui no és el dia"];
  var CHECKS = [
    { icon: "map", label: "Mira el mapa", text: "Consulta el mapa i comprova que l'itinerari s'adapta a les teves possibilitats." },
    { icon: "weather", label: "Mira el temps", text: "Mira la previsió del temps abans de sortir." },
    { icon: "eye", label: "Atenció a l'entorn", text: "Para atenció a l'entorn, als vehicles i als passos de vianants." },
    { icon: "sign", label: "Si cal, canvia", text: "Si les condicions no són adequades, tria una altra ruta o deixa-ho per a un altre dia." }
  ];
  var END_A = { label: "A caminar", kick: "Avui camino", title: "Camina i observa", text: "Deixa que la pràctica t'acompanyi, al teu ritme i sense buscar respostes ràpides." };
  var END_B = { label: "Pràctica en un lloc tranquil", kick: "Avui no és el dia", title: "Pràctica en un lloc tranquil",
    text: "Si avui no és el dia, també pots fer la pràctica en un lloc tranquil." };
  var CHECK_KICK = "Abans de sortir · ";

  var ICON = {
    door: '<path d="M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21"/><path d="M3.5 21h17"/><circle cx="14.5" cy="12.5" r="1"/>',
    map: '<path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/>',
    weather: '<circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2.6v1.3M2.6 8.5h1.3M4.3 4.3l.9.9M12.7 4.3l-.9.9"/><path d="M9.5 19.5h7.5a3.3 3.3 0 0 0 .4-6.6 4.6 4.6 0 0 0-8.8 1.2 2.7 2.7 0 0 0 .9 5.4z"/>',
    eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    sign: '<path d="M12 21.5V3"/><path d="M12 5h6.3l2.2 2.2-2.2 2.2H12"/><path d="M12 12.4H5.7l-2.2 2.2 2.2 2.2H12"/>',
    steps: '<path d="M8.3 2.8c1.8 0 2.7 2 2.7 4.3S10.1 11.8 8.3 11.8 5.6 9.4 5.6 7.1 6.5 2.8 8.3 2.8z"/><path d="M6.4 14h3.8v1.1a1.9 1.9 0 0 1-3.8 0z"/><path d="M15.8 7c1.8 0 2.7 2 2.7 4.3s-.9 4.7-2.7 4.7-2.7-2.4-2.7-4.7S14 7 15.8 7z"/><path d="M13.9 18.2h3.8v1.1a1.9 1.9 0 0 1-3.8 0z"/>',
    calm: '<circle cx="12" cy="5.8" r="2.6"/><path d="M12 9.3v4.4M7 12.4l5 1.6 5-1.6M5 19.5c2.1-2.6 4.4-3.7 7-3.7s4.9 1.1 7 3.7"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
  };

  /* ---------- RITME (ms) ---------- */
  var T_FORK = 750, T_MOVE = 430, T_PAUSE = 330, T_B = 1300;
  var TALL = 700;

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var scene = root.querySelector(".sortir__scene");
  var svg = root.querySelector(".sortir__svg");
  var nodesBox = root.querySelector(".sortir__nodes");
  var pop = root.querySelector(".sortir__pop");
  var replay = root.querySelector(".sortir__replay");
  var S = { t: 0, sel: null, playing: false, started: false, last: null, raf: 0, width: 0 };
  var G = null, PLAN = null, lastKey = "";

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ease(x) { x = clamp(x, 0, 1); return -(Math.cos(Math.PI * x) - 1) / 2; }
  function r1(n) { return Math.round(n * 10) / 10; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
  function spline(P) {
    var d = "M" + r1(P[0][0]) + "," + r1(P[0][1]);
    for (var i = 0; i < P.length - 1; i++) {
      var p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      d += "C" + r1(p1[0] + (p2[0] - p0[0]) / 6) + "," + r1(p1[1] + (p2[1] - p0[1]) / 6) + " " + r1(p2[0] - (p3[0] - p1[0]) / 6) + "," + r1(p2[1] - (p3[1] - p1[1]) / 6) + " " + r1(p2[0]) + "," + r1(p2[1]);
    }
    return d;
  }

  /* ---------- GEOMETRIA ---------- */
  function geometry(W) {
    var g = { W: W, tall: W < TALL }, H;
    if (!g.tall) {
      // Ordinador: la porta a l'esquerra; a dalt, «avui camino»; a baix, «avui no és el dia»
      H = Math.round(clamp(W * .44, 360, 420));
      var yA = H * .36, yB = H * .76;
      g.door = [Math.max(76, W * .07), H * .55]; g.fork = [W * .17, H * .55];
      g.checks = [.41, .53, .65, .77].map(function (f) { return [W * f, yA]; });
      g.endA = [W * .9, yA]; g.endB = [W * .42, yB];
      g.pathA = spline([g.fork, [W * .23, yA + 6], [W * .29, yA]].concat(g.checks, [g.endA]));
      g.pathB = spline([g.fork, [W * .23, yB - 6], [W * .3, yB], g.endB]);
      g.pathIn = "M" + r1(g.door[0]) + "," + r1(g.door[1]) + "L" + r1(g.fork[0]) + "," + r1(g.fork[1]);
      g.wayA = [W * .29, yA]; g.wayB = [W * .29, yB];
      g.msg = [W * .79, yB]; g.mw = Math.round(W * .27);
      g.checkLab = "a"; g.endALab = "a"; g.endBLab = "r"; g.doorLab = "b"; g.lw = Math.round(W * .15);
    } else {
      // Mòbil: de dalt a baix; dues columnes, una per a cada opció
      var xA = W * .25, xB = W * .79, y0 = 56;
      g.door = [W * .5, y0]; g.fork = [W * .5, y0 + 120];
      g.msg = [W * .5, y0 + 66]; g.mw = Math.round(W - 40);
      var yW = y0 + 168;
      g.wayA = [xA, yW]; g.wayB = [xB - 6, yW];
      g.checks = [0, 1, 2, 3].map(function (i) { return [xA, yW + 70 + i * 82]; });
      g.endA = [xA, yW + 70 + 4 * 82 + 6];
      g.endB = [xB, yW + 96];
      g.pathIn = "M" + r1(g.door[0]) + "," + r1(g.door[1]) + "L" + r1(g.fork[0]) + "," + r1(g.fork[1]);
      g.pathA = spline([g.fork, [xA + 12, yW - 14], [xA, yW + 12]].concat(g.checks, [g.endA]));
      g.pathB = spline([g.fork, [xB - 12, yW - 14], [xB, yW + 12], g.endB]);
      g.checkLab = "r"; g.endALab = "r"; g.endBLab = "b"; g.doorLab = "r";
      g.lw = Math.round(xB - 58 - (xA + 34));
      H = Math.round(g.endA[1] + 52);
    }
    g.H = H;
    return g;
  }

  /* ---------- DIBUIX ---------- */
  function render() {
    var W = Math.round(root.clientWidth);
    if (!W) return;
    G = geometry(W);
    var H = G.H;
    root.style.setProperty("--sw", W + "px");
    root.style.setProperty("--sh", H + "px");
    root.style.setProperty("--lw", G.lw + "px");
    root.style.setProperty("--mw", G.mw + "px");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var base = ' fill="none" stroke="#1a4d40" stroke-opacity=".35" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10"';
    var solid = ' fill="none" stroke="#1a4d40" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"';
    svg.innerHTML = [
      '<defs><linearGradient id="sortir-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f2"/><stop offset="1" stop-color="#f8f4ea"/></linearGradient></defs>',
      '<rect width="' + W + '" height="' + H + '" fill="url(#sortir-bg)"/>',
      '<path d="' + G.pathIn + '"' + base + '/>', '<path d="' + G.pathA + '"' + base + '/>', '<path d="' + G.pathB + '"' + base.replace('stroke="#1a4d40"', 'stroke="#c9a53c"') + '/>',
      '<path class="sortir__in" d="' + G.pathIn + '"' + solid + '/>',
      '<path class="sortir__a" d="' + G.pathA + '"' + solid + '/>',
      '<path class="sortir__b" d="' + G.pathB + '"' + solid.replace('stroke="#1a4d40"', 'stroke="#c9a53c"') + '/>',
      '<g class="sortir__wa"><circle class="sortir__halo" r="14" fill="#e2c668"/><circle r="7.5" fill="#e2c668" stroke="#fff" stroke-width="3"/></g>',
      '<g class="sortir__wb"><circle class="sortir__halo" r="14" fill="#e2c668"/><circle r="7.5" fill="#e2c668" stroke="#fff" stroke-width="3"/></g>'
    ].join("");

    function node(k, at, icon, label, lab, cls, tick) {
      return '<div class="sortir__node' + (cls ? ' sortir__node--' + cls : '') + '" data-k="' + k + '" style="left:' + r1(at[0]) + 'px;top:' + r1(at[1]) + 'px">' +
        '<button type="button" class="sortir__dot" aria-label="' + esc(label) + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[icon] + '</svg>' +
        (tick ? '<span class="sortir__tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + ICON.check + '</svg></span>' : '') +
        '</button><span class="sortir__lab sortir__lab--' + lab + '" aria-hidden="true">' + esc(label) + '</span></div>';
    }
    var html = [node("door", G.door, "door", DOOR.label, G.doorLab, "door")];
    CHECKS.forEach(function (c, i) { html.push(node("c" + i, G.checks[i], c.icon, c.label, G.tall ? G.checkLab : (i % 2 ? "b" : "a"), "check", true)); });
    html.push(node("endA", G.endA, "steps", END_A.label, G.endALab, "end"));
    html.push(node("endB", G.endB, "calm", END_B.label, G.endBLab, "end"));
    html.push('<span class="sortir__way" data-w="0" style="left:' + r1(G.wayA[0]) + 'px;top:' + r1(G.wayA[1]) + 'px">' + esc(WAYS[0]) + '</span>');
    html.push('<span class="sortir__way sortir__way--b" data-w="1" style="left:' + r1(G.wayB[0]) + 'px;top:' + r1(G.wayB[1]) + 'px">' + esc(WAYS[1]) + '</span>');
    html.push('<p class="sortir__msg" style="left:' + r1(G.msg[0]) + 'px;top:' + r1(G.msg[1]) + 'px">' + esc(MSG) + '</p>');
    nodesBox.innerHTML = html.join("");

    G.pin = svg.querySelector(".sortir__in"); G.pa = svg.querySelector(".sortir__a"); G.pb = svg.querySelector(".sortir__b");
    G.wa = svg.querySelector(".sortir__wa"); G.wb = svg.querySelector(".sortir__wb");
    [G.pin, G.pa, G.pb].forEach(function (p) { p._len = p.getTotalLength(); p.style.strokeDasharray = p._len; });
    // On és cada comprovació al llarg del camí «avui camino»
    G.LA = G.checks.map(function (c) {
      var best = Infinity, at = 0;
      for (var l = 0; l <= G.pa._len; l += 1.5) { var q = G.pa.getPointAtLength(l), d = Math.abs(q.x - c[0]) + Math.abs(q.y - c[1]); if (d < best) { best = d; at = l; } }
      return at;
    });
    G.nodes = {};
    Array.prototype.forEach.call(nodesBox.querySelectorAll(".sortir__node"), function (el) { G.nodes[el.getAttribute("data-k")] = el; });
    G.ways = Array.prototype.slice.call(nodesBox.querySelectorAll(".sortir__way"));
    G.msgEl = nodesBox.querySelector(".sortir__msg");
    plan();
    lastKey = "";
    apply();
    if (S.sel) openPop(S.sel);
  }

  /* ---------- PLA: fins a la cruïlla, i després les dues opcions alhora ---------- */
  function plan() {
    var segA = [], t = T_FORK, prev = 0;
    G.LA.forEach(function (l, i) { segA.push({ t0: t, t1: t + T_MOVE, a: prev, b: l }); t += T_MOVE; segA.push({ t0: t, t1: t + T_PAUSE, a: l, b: l, at: i }); t += T_PAUSE; prev = l; });
    segA.push({ t0: t, t1: t + T_MOVE, a: prev, b: G.pa._len }); t += T_MOVE;
    PLAN = { segA: segA, endA: t, endB: T_FORK + T_B, end: Math.max(t, T_FORK + T_B) + 200 };
  }
  function posA(t) {
    if (t < T_FORK) return 0;
    if (t >= PLAN.endA) return G.pa._len;
    for (var i = 0; i < PLAN.segA.length; i++) { var s = PLAN.segA[i]; if (t < s.t1) return s.a + (s.b - s.a) * ease((t - s.t0) / (s.t1 - s.t0)); }
    return G.pa._len;
  }

  /* ---------- ESTAT ---------- */
  function apply() {
    if (!G) return;
    var t = S.t, done = t >= PLAN.end;
    var fin = ease(t / T_FORK), la = posA(t), lb = G.pb._len * ease((t - T_FORK) / T_B);
    G.pin.style.strokeDashoffset = G.pin._len * (1 - fin);
    G.pa.style.strokeDashoffset = G.pa._len - la;
    G.pb.style.strokeDashoffset = G.pb._len - lb;
    var p;
    if (t < T_FORK) { p = G.pin.getPointAtLength(G.pin._len * fin); G.wa.setAttribute("transform", "translate(" + r1(p.x) + "," + r1(p.y) + ")"); G.wb.setAttribute("opacity", 0); }
    else {
      p = G.pa.getPointAtLength(la); G.wa.setAttribute("transform", "translate(" + r1(p.x) + "," + r1(p.y) + ")");
      p = G.pb.getPointAtLength(lb); G.wb.setAttribute("transform", "translate(" + r1(p.x) + "," + r1(p.y) + ")");
      G.wb.setAttribute("opacity", t < PLAN.endB ? 1 : 0);
    }
    G.wa.setAttribute("opacity", t < PLAN.endA ? 1 : 0);
    var checks = G.LA.map(function (l) { return la >= l - 1 ? 1 : 0; }).join("");
    var key = [t > 0, t >= T_FORK, checks, t >= PLAN.endA, t >= PLAN.endB, done, S.sel].join("|");
    if (key === lastKey) return;
    lastKey = key;
    function set(k, on) {
      var el = G.nodes[k];
      if (on && !el.classList.contains("is-on") && S.playing) { el.classList.add("is-pop"); setTimeout(function () { el.classList.remove("is-pop"); }, 650); }
      el.classList.toggle("is-on", on);
      el.classList.toggle("is-sel", S.sel === k);
    }
    G.nodes.door.classList.toggle("is-sel", S.sel === "door");
    CHECKS.forEach(function (c, i) { set("c" + i, checks.charAt(i) === "1"); });
    set("endA", t >= PLAN.endA); set("endB", t >= PLAN.endB);
    G.ways.forEach(function (w) { w.classList.toggle("is-on", t >= T_FORK); });
    G.msgEl.classList.toggle("is-on", t >= T_FORK * .7);
    replay.hidden = !(done && !reduce);
  }

  /* ---------- GLOBUS ---------- */
  function openPop(k) {
    var d, at = G.nodes[k].style;
    if (k === "door") d = DOOR; else if (k === "endA") d = END_A; else if (k === "endB") d = END_B;
    else { var c = CHECKS[+k.slice(1)]; d = { kick: CHECK_KICK + (+k.slice(1) + 1) + " de 4", title: c.label, text: c.text }; }
    var x0 = parseFloat(at.left), y0 = parseFloat(at.top), half = 34;
    pop.querySelector(".sortir__pk").textContent = d.kick;
    pop.querySelector(".sortir__pt").textContent = d.title;
    pop.querySelector(".sortir__px").textContent = d.text;
    pop.classList.add("is-open");
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var x = clamp(x0 - pw / 2, 12, G.W - pw - 12);
    var y = y0 + half + ph + 8 <= G.H ? y0 + half : y0 - half - ph;
    pop.style.left = r1(x) + "px";
    pop.style.top = r1(clamp(y, 8, G.H - ph - 8)) + "px";
  }
  function select(k) { S.sel = k; lastKey = ""; apply(); if (k) openPop(k); else pop.classList.remove("is-open"); }

  /* ---------- ANIMACIÓ ---------- */
  function tick(ts) {
    if (!S.playing) return;
    if (S.last === null) S.last = ts;
    S.t += Math.min(64, ts - S.last); S.last = ts;
    if (S.t >= PLAN.end) { S.t = PLAN.end; S.playing = false; }
    apply();
    if (S.playing) S.raf = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(S.raf);
    S.started = true; S.sel = null; pop.classList.remove("is-open");
    if (reduce) { S.t = PLAN.end; S.playing = false; lastKey = ""; apply(); return; }
    S.t = 0; S.last = null; S.playing = true; lastKey = "";
    apply();
    setTimeout(function () { S.raf = requestAnimationFrame(tick); }, 300);
  }
  function stop() { cancelAnimationFrame(S.raf); S.playing = false; S.t = PLAN.end; S.started = true; }

  nodesBox.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest(".sortir__node") : null;
    if (!el) return;
    if (S.playing) stop();
    var k = el.getAttribute("data-k");
    select(S.sel === k ? null : k);
  });
  document.addEventListener("click", function (e) {
    if (S.sel && !(e.target.closest && (e.target.closest(".sortir__node") || e.target.closest(".sortir__pop")))) select(null);
  });
  root.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sel) select(null); });
  replay.addEventListener("click", function (e) { e.stopPropagation(); play(); });

  /* ---------- MIDA I ARRENCADA ---------- */
  render();
  S.width = Math.round(root.clientWidth);
  var pending = false;
  function onResize() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () {
      pending = false;
      var w = Math.round(root.clientWidth);
      if (w && w !== S.width) { S.width = w; render(); }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(root);
  else window.addEventListener("resize", onResize);

  if (reduce) { S.t = PLAN.end; apply(); }
  else if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting && !S.started) { io.disconnect(); play(); } });
    }, { threshold: 0.3 });
    io.observe(scene);
  } else play();
})();
</script>
