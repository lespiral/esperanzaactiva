<div class="llegir" data-llegir>
  <div class="llegir__grid">
    <div class="llegir__map" aria-hidden="true"><svg class="llegir__svg" viewBox="56 0 400 300" preserveAspectRatio="xMidYMid slice" focusable="false"></svg></div>
    <div class="llegir__side">

            <button type="button" class="llegir__p" data-p="3">26–33 min caminando</button> ·
            <button type="button" class="llegir__p" data-p="4">40–50 min con pausas</button> ·
            <button type="button" class="llegir__p" data-p="5">circular</button>

<style>
.llegir {

  --fh: var(--font-head, "Montserrat", ui-sans-serif, system-ui, sans-serif);
  --fb: var(--font-body, "Lato", ui-sans-serif, system-ui, sans-serif);
  position: relative; overflow: hidden; background: #fff; color: var(--cink); font-family: var(--fb);
  border: 1px solid var(--cline); border-radius: var(--radius-lg, 22px);

}
.llegir *, .llegir *::before, .llegir *::after { box-sizing: border-box; }

.llegir__map { position: relative; min-height: 260px; }
.llegir__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.llegir__side { padding: 22px clamp(16px, 3vw, 26px); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.llegir__ex { font: 700 11.5px/1.3 var(--fh); letter-spacing: .08em; text-transform: uppercase; color: var(--cmuted); }

/* La fitxa, com a la web */
.llegir__card { display: flex; gap: 14px; padding: 16px 18px; border: 1px solid var(--cline); border-radius: var(--radius, 16px); background: #fff; }

.llegir span.llegir__go { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0; padding: 8px 12px; border-radius: 999px; font: 700 14.5px/1.2 var(--fh); color: var(--c8); background: var(--c05); border: 1px solid var(--c1); }

.llegir__cap { min-height: 74px; padding: 11px 14px 12px; border-radius: 14px; background: #fff; border: 1px dashed var(--c2); }

/* Mapa */
.ll-route { fill: none; stroke: #1a4d40; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.ll-arrow { fill: #1a4d40; opacity: 0; transition: opacity .4s; }
.llegir.is-loop .ll-arrow { opacity: 1; }
.ll-pin { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .4s cubic-bezier(.34, 1.56, .64, 1); }
.llegir.is-pin .ll-pin { transform: scale(1.18); }
.ll-start { opacity: 0; transition: opacity .4s; }
.llegir.is-start .ll-start { opacity: 1; }
.ll-halo { transform-box: fill-box; transform-origin: center; animation: llegir-pulse 1.8s ease-in-out infinite; }
.ll-chip { opacity: 0; transition: opacity .4s; }
.llegir.is-km .ll-chip { opacity: 1; }

.llegir__foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  min-height: 60px; padding: 10px clamp(14px, 3vw, 24px); border-top: 1px solid var(--cline); background: #fff;
}
.llegir__hint { font-size: 14.5px; color: var(--cmuted); }
.llegir__replay {
  flex: none; display: inline-flex; align-items: center; gap: .45em; padding: .55em 1em;
  border-radius: 999px; border: 2px solid var(--c2); background: #fff; color: var(--c8);
  font: 700 14px/1.2 var(--fh); cursor: pointer; transition: border-color .15s, color .15s, transform .15s;
}
.llegir__replay:hover { border-color: var(--c7); color: var(--c9); transform: translateY(-1px); }
.llegir__replay:focus-visible { outline: 3px solid var(--c7); outline-offset: 2px; }
.llegir__replay svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.llegir__replay[hidden] { display: none; }
@keyframes llegir-pulse { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.5); opacity: .15; } }
@keyframes llegir-fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .llegir *, .llegir *::before, .llegir *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(function () {
  "use strict";
  var root = document.querySelector("[data-llegir]");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  /* ---------- EXPLICACIÓ DE CADA DADA ---------- */
  var PARTS = [
    ["El número", "Es el número de la ruta en el mapa."],
    ["El punto de salida", "De dónde sale la ruta: una plaza, un parque, un centro de salud o un equipamiento."],
    ["La distancia", "Los kilómetros de toda la vuelta."],
    ["Caminando", "El tiempo aproximado si caminas sin pararte."],
    ["Con pausas", "El tiempo aproximado si haces alguna parada para descansar, o cuando lo necesites. La reflexión se hace caminando."],
    ["Circular", "Acabas donde has empezado: vuelves al punto de salida."],
    ["La dirección", "Dónde está el punto de salida, para llegar."],
    ["Abrir el mapa", "Abre a pantalla completa el mapa donde está la ruta, con todas las rutas de ese mapa."]
  ];
  var INTRO = ["Cómo leer una ruta", "Cada ruta tiene estos datos. Míralo."];
  var OUTRO = ["Ya está", "Elige la que se adapte a tu tiempo y a tus posibilidades."];

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var svg = root.querySelector(".llegir__svg");

  var replay = root.querySelector(".llegir__replay");
  var S = { t: 0, sel: -1, playing: false, started: false, last: null, raf: 0 }, lastKey = "", END = (PARTS.length + 1) * STEP;

  function r1(n) { return Math.round(n * 10) / 10; }

  /* ---------- MAPA ---------- */
  var loop = "M150 222 L150 150 Q150 128 172 128 L262 128 Q284 128 284 106 L284 76 Q284 56 304 56 L342 56 Q362 56 362 76 L362 210 Q362 232 340 232 L172 232 Q150 232 150 222 Z";
  var out = ['<rect width="480" height="300" fill="#ece5d6"/>', '<g stroke="#faf7f0" stroke-width="10" stroke-linecap="round">'];

  [56, 128, 232, 280].forEach(function (y) { out.push('<line x1="-10" y1="' + y + '" x2="490" y2="' + y + '"/>'); });
  out.push('</g>',
    '<path d="M298 74h50v122a14 14 0 0 1-14 14h-36z" fill="#d3e5da"/>',
    '<g fill="#b5cfc0"><circle cx="312" cy="96" r="9"/><circle cx="334" cy="118" r="8"/><circle cx="314" cy="150" r="10"/><circle cx="336" cy="182" r="8"/></g>',
    '<rect x="166" y="148" width="104" height="66" rx="8" fill="#e5dbc5"/><circle cx="218" cy="181" r="14" fill="#d3e6e1" stroke="#b9d0c8" stroke-width="2"/>',
    '<path d="' + loop + '" fill="none" stroke="#1a4d40" stroke-opacity=".3" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 9"/>',
    '<path class="ll-route" d="' + loop + '"/>',
    '<g class="ll-arrows"></g>',
    '<g class="ll-start"><rect x="104" y="238" width="92" height="24" rx="12" fill="#1a4d40"/><text x="150" y="254.5" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" fill="#fff">salida y llegada</text></g>',
    '<g class="ll-chip"><rect x="198" y="104" width="62" height="22" rx="11" fill="#e2c668" stroke="#fff" stroke-width="2"/><text x="229" y="119.5" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" fill="#11352c">2,2 km</text></g>',
    '<g class="ll-walker"><circle class="ll-halo" r="13" fill="#e2c668"/><circle r="7" fill="#e2c668" stroke="#fff" stroke-width="3"/></g>',
    '<g class="ll-pin"><path d="M150 222c-9-11-15-18-15-25a15 15 0 0 1 30 0c0 7-6 14-15 25z" fill="#e2c668" stroke="#fff" stroke-width="2.5"/><text x="150" y="202" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="13" fill="#11352c">1</text></g>');
  svg.innerHTML = out.join("");
  var route = svg.querySelector(".ll-route"), walker = svg.querySelector(".ll-walker"), total = route.getTotalLength();
  route.style.strokeDasharray = total;
  var arrows = [];
  [.14, .38, .62, .86].forEach(function (f) {
    var a = route.getPointAtLength(total * f), b = route.getPointAtLength(total * f + 1), ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    arrows.push('<path class="ll-arrow" d="M-5 -5L4 0L-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(' + r1(a.x) + ',' + r1(a.y) + ') rotate(' + r1(ang) + ')"/>');
  });
  svg.querySelector(".ll-arrows").innerHTML = arrows.join("");

  /* ---------- ESTAT ---------- */
  function ease(x) { x = Math.max(0, Math.min(1, x)); return -(Math.cos(Math.PI * x) - 1) / 2; }
  function apply() {
    var t = S.t, idx = S.sel >= 0 ? S.sel : (t < STEP * .5 ? -1 : Math.floor(t / STEP - .5)), done = t >= END && S.sel < 0;
    var lp = ease((t / STEP - .5 - LOOP0) / (LOOP1 + 1 - LOOP0));
    if (S.sel >= 0 || t >= END) lp = 1;
    route.style.strokeDashoffset = total * (1 - lp);
    var p = route.getPointAtLength(total * lp);
    walker.setAttribute("transform", "translate(" + r1(p.x) + "," + r1(p.y) + ")");
    walker.setAttribute("opacity", lp > 0 && lp < 1 ? 1 : 0);
    if (idx >= PARTS.length) idx = -2;
    var key = idx + "|" + done + "|" + (lp >= 1);
    if (key === lastKey) return;
    lastKey = key;
    parts.forEach(function (el) { el.classList.toggle("is-on", +el.getAttribute("data-p") === idx); });
    root.classList.toggle("is-pin", idx === 0 || idx === 6);
    root.classList.toggle("is-start", idx === 1 || idx === 5 || idx === 6);
    root.classList.toggle("is-km", idx === 2 || done);
    root.classList.toggle("is-loop", lp >= 1);
    var c = idx >= 0 ? PARTS[idx] : idx === -2 ? OUTRO : INTRO;
    ck.textContent = c[0]; ct.textContent = c[1];
    cap.classList.remove("is-fresh"); void cap.offsetWidth; cap.classList.add("is-fresh");

  }

  /* ---------- ANIMACIÓ ---------- */
  function tick(ts) {
    if (!S.playing) return;
    if (S.last === null) S.last = ts;
    S.t += Math.min(64, ts - S.last); S.last = ts;
    if (S.t >= END) { S.t = END; S.playing = false; }
    apply();
    if (S.playing) S.raf = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(S.raf);
    S.started = true; S.sel = -1;
    if (reduce) { S.t = END; S.playing = false; lastKey = ""; apply(); return; }
    S.t = 0; S.last = null; S.playing = true; lastKey = "";
    apply();
    setTimeout(function () { S.raf = requestAnimationFrame(tick); }, 300);
  }
  function choose(el) {
    cancelAnimationFrame(S.raf); S.playing = false; S.t = END; S.started = true;
    var i = +el.getAttribute("data-p");
    S.sel = S.sel === i ? -1 : i; lastKey = ""; apply();
  }
  parts.forEach(function (el) {
    el.addEventListener("click", function (e) { e.preventDefault(); choose(el); });
    el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(el); } });
  });
  replay.addEventListener("click", play);

  if (reduce) { S.t = END; apply(); }
  else if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (en) { if (en[0].isIntersecting && !S.started) { io.disconnect(); play(); } }, { threshold: 0.35 });
    io.observe(root);
  } else play();

</script>
